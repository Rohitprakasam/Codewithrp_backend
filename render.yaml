services:
  - type: web
    name: codewithrp-backend
    env: docker
    region: ohio
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: codewithrp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: codewithrp-db
    databaseName: codewithrp
    user: admin
    region: ohio
    plan: free
